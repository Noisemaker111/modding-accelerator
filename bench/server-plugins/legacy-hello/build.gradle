// server-check's own test plugin for old servers: built against the Spigot 1.8.8 API, so the same jar loads on
// every Paper line from 1.8.8 up, and the bot (joining through ViaProxy) checks it answers on each.
plugins { id 'java' }

group = 'dev.modaccel'
version = '1.0'

repositories {
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    mavenCentral()
}

dependencies {
    // Only the Bukkit classes are needed to compile; the server provides them at run time.
    compileOnly('org.spigotmc:spigot-api:1.8.8-R0.1-SNAPSHOT') { transitive = false }
}

tasks.withType(JavaCompile).configureEach { options.release = 8 }
