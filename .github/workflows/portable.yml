name: Portable command
# Every check on Windows, Linux and macOS before main: the repository is user-owned, so there is no merge queue, and a
# pull request is the last run before main. A job runs one plan of tools/ci/lanes.py: its checks side by side, as many
# at once as the runner has cores, each in its own process with its own log. The plans:
#   core         package, self-test, the bench tests, Fabric/FastLane/Gradle gates and the launchers
#   server       server plugins on MockBukkit, and every server-check unit on a real Paper server with the bot
#   stonecutter  three Stonecutter nodes, set up and compiled through modaccel on fresh pinned clones
# tools/ci/reach.py skips a plan on a pull request only when no changed file can reach it (a docs-only change starts no
# server); main, the merge queue (merge_group, once the repository has one) and workflow_dispatch run every plan.
# Caches are written only by main and only read by pull requests, so a pull request starts from main's downloads.
# No retries and no schedule: every input is pinned, so a failure is a bug to find, and a rerun of unchanged code
# repeats the last answer.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
# main: one full-suite run at a time plus one pending; a merge landing while one runs waits, and the pending run
# tests every merge queued behind it (GitHub keeps only the newest pending run, which contains the older ones).
# Every other ref: a newer push cancels the run in progress.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && 'full-suite' || format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !(github.ref == 'refs/heads/main' && github.event_name == 'push') }}
jobs:
  reach:
    name: what the change reaches
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      core: ${{ steps.reach.outputs.core }}
      server: ${{ steps.reach.outputs.server }}
      stonecutter: ${{ steps.reach.outputs.stonecutter }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          fetch-depth: 0
          sparse-checkout: tools/ci
      - id: reach
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 tools/ci/reach.py "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"
          else
            printf 'core=true\nserver=true\nstonecutter=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

  core:
    needs: reach
    if: needs.reach.outputs.core == 'true'
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          # A space in the path: every launcher and test must quote it.
          path: portable workspace
      - uses: ./portable workspace/.github/actions/setup
        id: setup
        with:
          plan: core
          workspace: portable workspace
          prefix: portable workspace/
      - name: Core checks side by side
        working-directory: portable workspace
        run: python tools/ci/lanes.py core --timings "${{ runner.temp }}/timings.json"
      - uses: ./portable workspace/.github/actions/finish
        if: always()
        with:
          plan: core
          workspace: portable workspace
          prefix: portable workspace/
          hit: ${{ steps.setup.outputs.cache-hit }}
          status: ${{ job.status }}
          name: core-${{ runner.os }}

  server:
    needs: reach
    if: needs.reach.outputs.server == 'true'
    name: server (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.of }})
    # Each unit is a Paper server, two at a time per job. Linux and Windows split four ways; macOS two, because an
    # account runs at most five macOS jobs at once and every macOS job of every open pull request queues for them.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, shard: 1, of: 4}
          - {os: ubuntu-latest, shard: 2, of: 4}
          - {os: ubuntu-latest, shard: 3, of: 4}
          - {os: ubuntu-latest, shard: 4, of: 4}
          - {os: windows-latest, shard: 1, of: 4}
          - {os: windows-latest, shard: 2, of: 4}
          - {os: windows-latest, shard: 3, of: 4}
          - {os: windows-latest, shard: 4, of: 4}
          - {os: macos-latest, shard: 1, of: 2}
          - {os: macos-latest, shard: 2, of: 2}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/setup
        id: setup
        with:
          plan: server
      - name: Server checks side by side
        run: python tools/ci/lanes.py server --shard ${{ matrix.shard }}/${{ matrix.of }} --timings "${{ runner.temp }}/timings.json"
      - uses: ./.github/actions/finish
        if: always()
        with:
          plan: server
          hit: ${{ steps.setup.outputs.cache-hit }}
          status: ${{ job.status }}
          name: server-${{ runner.os }}-${{ matrix.shard }}

  stonecutter:
    needs: reach
    if: needs.reach.outputs.stonecutter == 'true'
    name: stonecutter (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
      - uses: ./.github/actions/setup
        id: setup
        with:
          plan: stonecutter
      - name: Stonecutter nodes side by side
        run: python tools/ci/lanes.py stonecutter --timings "${{ runner.temp }}/timings.json"
      - uses: ./.github/actions/finish
        if: always()
        with:
          plan: stonecutter
          hit: ${{ steps.setup.outputs.cache-hit }}
          status: ${{ job.status }}
          name: stonecutter-${{ runner.os }}

  # The one check to require before merging: it passes only when every plan the change reaches passed. A plan the
  # change cannot reach is skipped, and a skipped plan passes here; a failed or cancelled one does not.
  result:
    name: Portable command result
    needs: [reach, core, server, stonecutter]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | python3 -c "
          import json, sys
          needs = json.load(sys.stdin)
          bad = {k: v['result'] for k, v in needs.items() if v['result'] not in ('success', 'skipped')}
          for k, v in needs.items(): print(f'{k}: {v[\"result\"]}')
          if needs['reach']['result'] != 'success': bad['reach'] = needs['reach']['result']
          sys.exit(f'Not passed: {bad}' if bad else 0)"
