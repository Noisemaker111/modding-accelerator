name: Portable command
# A PR runs once, newer pushes cancel older runs, and only the core runs on all three systems.
# Server and Stonecutter checks run on Linux for a PR and on all three systems nightly and on main.
# PR CI finishes in under 5 minutes (AGENTS.md): on pull_request every job has a 5-minute timeout and
# the budget job fails the run when the whole workflow took over 300 s. Nightly and main keep the
# longer timeouts because their caches are cold on two of the three systems.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  command:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 15 }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: portable workspace
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Gradle and JDK caches
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
          key: command-${{ runner.os }}-${{ hashFiles('portable workspace/build.gradle', 'portable workspace/settings.gradle', 'portable workspace/gradle.properties', 'portable workspace/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Map and bench colour per loader
        working-directory: portable workspace
        run: python bench/test_ledger_rule.py
      - name: Roadmap and measures agree, ROADMAP.md is current
        working-directory: portable workspace
        run: python bench/test_measures.py
      - name: Session cost meter reads processes on this system
        working-directory: portable workspace
        run: python bench/test_session_cost.py
      - name: Package without PowerShell
        working-directory: portable workspace
        run: java tools/cli/Bootstrap.java . package --json
      - name: Source launcher (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: portable workspace
        run: '& .\modaccel.cmd doctor --json'
      - name: Source launcher (POSIX)
        if: runner.os != 'Windows'
        working-directory: portable workspace
        run: ./modaccel doctor --json
      - name: Standalone package
        working-directory: portable workspace
        run: java -jar build/distributions/modaccel.jar self-test --root . --json
      - name: Extracted portable ZIP acceptance
        working-directory: portable workspace
        run: java tools/tests/PackageAcceptanceTest.java build/distributions/modaccel-portable.zip build/distributions/modaccel-portable.zip.sha256 "${{ runner.temp }}"
      - name: Fabric metadata and logic
        working-directory: portable workspace
        run: java -jar build/distributions/modaccel.jar fast --json
      - name: Hidden window stays hidden with the agent named twice
        working-directory: portable workspace
        run: java tools/tests/BackgroundWindowsTest.java . build/distributions/modaccel.jar
      - name: Legacy launch agent with Gradle
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: portable workspace
        run: |
          $prepared = & java -jar build/distributions/modaccel.jar legacy-agent --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $prepared.ok) { throw 'Could not build the legacy launch agent' }
          $env:JAVA_TOOL_OPTIONS = '"-javaagent:' + $prepared.result.agent + '=legacy" -Dmodaccel.background=true -Dmodaccel.quiet=true'
          & java tools/tests/LegacyAgentPropertiesTest.java
          if ($LASTEXITCODE -ne 0) { throw 'Legacy launch agent corrupted system properties' }
          & java -jar build/distributions/modaccel.jar fast --refresh --json
          if ($LASTEXITCODE -ne 0) { throw 'Gradle failed with the legacy launch agent enabled' }
      - name: Multi-module FastLane isolation
        working-directory: portable workspace
        run: java tools/tests/FastLaneIsolationTest.java . build/distributions/modaccel.jar
      - name: Runtime-only file that does not download
        working-directory: portable workspace
        run: java tools/tests/RuntimeNativesTest.java . build/distributions/modaccel.jar
      - name: Port rewrites before compilation
        working-directory: portable workspace
        run: |
          javac --release 21 -d .runs/preflight-tests tools/VersionMap.java tools/tests/PortPreflightTest.java tools/tests/ChainMapTest.java
          java -cp .runs/preflight-tests PortPreflightTest
          java -cp .runs/preflight-tests ChainMapTest
      - name: Stop Gradle so Windows can read its cache locks
        if: always() && runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: Get-Process java -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Save caches on a miss
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
          key: command-${{ runner.os }}-${{ hashFiles('portable workspace/build.gradle', 'portable workspace/settings.gradle', 'portable workspace/gradle.properties', 'portable workspace/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Outcome receipts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ runner.os }}-${{ runner.arch }}-outcomes
          path: |
            portable workspace/.runs
            portable workspace/.modaccel
          include-hidden-files: true
          if-no-files-found: ignore
  server-plugins:
    # Pinned server plugins (bench/server-plugins/manifest.json) on fresh clones through
    # the packaged command: fast, the jar, and plugin-check on MockBukkit, including each break made on purpose.
    # The Gradle home is cached: without it the plugin's first `fast` downloads Paper and MockBukkit on
    # every run, which took 289 s on a slow runner (446 s for the job, the one PR run over budget).
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 15 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Gradle and JDK caches
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            .modaccel/jdks
          key: server-plugins-${{ runner.os }}-${{ hashFiles('bench/server-plugins/manifest.json') }}
      - name: Package without PowerShell
        run: java tools/cli/Bootstrap.java . package --json
      - name: Server plugins through modaccel
        run: java tools/tests/ServerPluginFixtures.java . build/distributions/modaccel.jar
      - name: Stop the plugin's Gradle daemon so Windows can read its cache locks
        if: always() && runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: Get-Process java -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Save caches on a miss, even when the check fails
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            .modaccel/jdks
          key: server-plugins-${{ runner.os }}-${{ hashFiles('bench/server-plugins/manifest.json') }}
      - name: Outcome receipts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-plugins-${{ runner.os }}-outcomes
          path: |
            .runs
          include-hidden-files: true
          if-no-files-found: ignore
  server-check:
    # Plugins on real headless Paper servers with a bot player (tools/tests/ServerCheckFixtures.java),
    # one part per job so the parts run side by side: scenario: AgentCraft's scenario on a fresh world.
    # bot: the bot's own scenario with a secret that must stay masked, and the missing-secret failure.
    # breaks: each break made on purpose. The Paper jar and Gradle home are cached.
    name: server-check (${{ matrix.part }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        part: [scenario, bot, breaks]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 15 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Paper, Gradle and JDK caches
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            .modaccel/jdks
            ~/.modaccel/servers
            ~/.modaccel/tools
          key: server-check-${{ runner.os }}-${{ matrix.part }}-${{ hashFiles('bench/server-plugins/manifest.json', 'knowledge/mcprotocollib.json', 'knowledge/viaproxy.json') }}
      - name: Package without PowerShell
        run: java tools/cli/Bootstrap.java . package --json
      - name: Plugins on a real Paper server through modaccel
        run: java tools/tests/ServerCheckFixtures.java . build/distributions/modaccel.jar "${{ matrix.part }}"
      - name: Stop the plugin's Gradle daemon so Windows can read its cache locks
        if: always() && runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: Get-Process java -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Save caches on a miss, even when the check fails
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            .modaccel/jdks
            ~/.modaccel/servers
            ~/.modaccel/tools
          key: server-check-${{ runner.os }}-${{ matrix.part }}-${{ hashFiles('bench/server-plugins/manifest.json', 'knowledge/mcprotocollib.json', 'knowledge/viaproxy.json') }}
      - name: Outcome receipts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-check-${{ runner.os }}-${{ matrix.part }}-outcomes
          path: |
            .runs
          include-hidden-files: true
          if-no-files-found: ignore
  stonecutter-sample:
    # Three representative Stonecutter nodes, fresh pinned clones, setup and compile through
    # modaccel, one job per node. No game. Every node of both
    # mods compiles nightly in stonecutter-nightly.yml (not a merge blocker).
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        mod: [diorama-26.3, diorama-1.21.1, ias-26.3-fabric]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && 5 || 20 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Gradle and JDK caches
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            .modaccel/jdks
          key: sample-${{ runner.os }}-${{ matrix.mod }}-${{ hashFiles('bench/real-mods/manifest.json') }}
      - name: Setup and compile the node
        run: python bench/real-mods/run.py --compile-nodes --only ${{ matrix.mod }} --cache "${{ runner.temp }}/real-mods" --out "${{ runner.temp }}/real-mods-results" --label ${{ matrix.mod }}
      - name: Save caches on a miss, even when the node fails
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            .modaccel/jdks
          key: sample-${{ runner.os }}-${{ matrix.mod }}-${{ hashFiles('bench/real-mods/manifest.json') }}
      - name: Node results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-${{ runner.os }}-${{ matrix.mod }}
          path: ${{ runner.temp }}/real-mods-results
          if-no-files-found: ignore
  budget:
    # The 5-minute rule as a check that can fail: once every PR job has finished, read this run's jobs
    # and fail when the workflow has been running for more than 300 s since it started, queue time
    # included. The job summary lists every job with its queue wait and duration, so a failure names the job.
    name: PR CI under 5 minutes
    if: always() && github.event_name == 'pull_request'
    needs: [command, server-plugins, server-check, stonecutter-sample]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Elapsed time of this run against the 300 s budget
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" > jobs.json
          python3 - <<'EOF'
          import json, os, sys
          from datetime import datetime, timezone
          def at(s): return datetime.fromisoformat(s.replace('Z', '+00:00'))
          run = json.load(open('run.json'))
          jobs = json.load(open('jobs.json'))['jobs']
          started = at(run['run_started_at'])
          now = datetime.now(timezone.utc)
          elapsed = int((now - started).total_seconds())
          lines = ['| job | queued | ran | finished at |', '| --- | ---: | ---: | ---: |']
          for j in sorted(jobs, key=lambda j: j.get('completed_at') or ''):
              if not j.get('started_at'): continue
              s, e = at(j['started_at']), at(j['completed_at']) if j.get('completed_at') else now
              lines.append(f"| {j['name']} ({j['conclusion'] or 'running'}) | {int((s - started).total_seconds())} s | {int((e - s).total_seconds())} s | {int((e - started).total_seconds())} s |")
          verdict = f"{'PASS' if elapsed <= 300 else 'FAIL'}: this run has taken {elapsed} s of its 300 s budget (AGENTS.md: PR CI finishes in under 5 minutes)."
          body = '\n'.join([f'## {verdict}', ''] + lines) + '\n'
          open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(body)
          print(body)
          sys.exit(0 if elapsed <= 300 else 1)
          EOF
