name: CI
# The checks every pull request must pass (both are required on main): bench/run_tests.py on Linux and on Windows.
# The list of checks lives in bench/run_tests.py, not here. Server, plugin and Stonecutter checks are in integration.yml; heavy jobs (pack sweep, port
# board, perf A/B) are dispatched from cloud-*.yml with tools/cloud-run. No macOS: the code is not macOS-specific and
# its JFR sampling flaked (29 of 69 runs). Caches are saved only from a passing main run, so a PR never evicts them
# and a run whose downloads failed never saves a near-empty cache.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gradle and JDK caches
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            ~/.mmt/jdks
          key: ci-${{ runner.os }}-${{ hashFiles('fixtures/prism-lab/build.gradle', 'fixtures/prism-lab/settings.gradle', 'fixtures/prism-lab/gradle.properties', 'fixtures/prism-lab/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ci-${{ runner.os }}-
      - name: Offline checks
        run: python bench/run_tests.py
      - name: Stop Gradle before the cache save
        if: success() && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        run: pkill -f GradleDaemon || true
      - name: Save caches (main only)
        if: success() && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            ~/.mmt/jdks
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Receipts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runs
          path: .runs
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # A space in the path: the Windows launcher broke on it before.
          path: portable workspace
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gradle and JDK caches
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            ~/.mmt/jdks
          key: ci-${{ runner.os }}-${{ hashFiles('portable workspace/fixtures/prism-lab/build.gradle', 'portable workspace/fixtures/prism-lab/settings.gradle', 'portable workspace/fixtures/prism-lab/gradle.properties', 'portable workspace/fixtures/prism-lab/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ci-${{ runner.os }}-
      - name: Offline checks
        working-directory: portable workspace
        run: python bench/run_tests.py
      - name: Stop Java so Windows can read its cache locks
        if: success() && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: Get-Process java -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Save caches (main only)
        if: success() && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            ~/.mmt/jdks
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Receipts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-runs
          path: portable workspace/.runs
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  report-red-main:
    needs: [linux, windows]
    if: always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: report-red-main-ci
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: CI red on main
      LINUX_RESULT: ${{ needs.linux.result }}
      WINDOWS_RESULT: ${{ needs.windows.result }}
    steps:
      - name: Update or close red-main issue
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          short_sha="${GITHUB_SHA:0:7}"
          head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo "Skipping stale run for ${short_sha}; main is now at ${head_sha:0:7}."
            exit 0
          fi
          failed=()
          for pair in "linux:${LINUX_RESULT}" "windows:${WINDOWS_RESULT}"; do
            job="${pair%%:*}"
            res="${pair#*:}"
            if [ "$res" = "failure" ]; then
              failed+=("$job")
            fi
          done
          issues_json=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100")
          mapfile -t open_issues < <(
            printf '%s\n' "$issues_json" \
              | jq -rs --arg t "$TITLE" '[.[][] | select(.pull_request == null and .title == $t)] | sort_by(.number) | .[].number'
          )
          if [ "${#failed[@]}" -gt 0 ]; then
            failed_list=$(printf '%s, ' "${failed[@]}")
            failed_list="${failed_list%, }"
            body=$(printf 'CI is red on `main` at commit %s (`%s`).\n\n- Run: %s\n- Failed: %s\n- `linux`: %s\n- `windows`: %s\n' \
              "$GITHUB_SHA" "$short_sha" "$run_url" "$failed_list" "$LINUX_RESULT" "$WINDOWS_RESULT")
            if [ "${#open_issues[@]}" -eq 0 ]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues" \
                -f title="$TITLE" \
                -f body="$body" >/dev/null
              echo "Opened issue '${TITLE}' for ${short_sha} (failed: ${failed_list})."
            else
              issue="${open_issues[0]}"
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${issue}" \
                -f body="$body" >/dev/null
              comment=$(printf 'Still red on `main` at commit %s (`%s`): failed %s.\n\n- Run: %s\n- `linux`: %s\n- `windows`: %s\n' \
                "$GITHUB_SHA" "$short_sha" "$failed_list" "$run_url" "$LINUX_RESULT" "$WINDOWS_RESULT")
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments" \
                -f body="$comment" >/dev/null
              echo "Updated issue #${issue} for ${short_sha} (failed: ${failed_list})."
            fi
          elif [ "${LINUX_RESULT}" = "success" ] && [ "${WINDOWS_RESULT}" = "success" ]; then
            if [ "${#open_issues[@]}" -eq 0 ]; then
              echo "CI is green on main and no open '${TITLE}' issue exists."
              exit 0
            fi
            comment=$(printf 'CI is green again on `main` at commit %s (`%s`).\n\n- Run: %s\n- `linux`: %s\n- `windows`: %s\n' \
              "$GITHUB_SHA" "$short_sha" "$run_url" "$LINUX_RESULT" "$WINDOWS_RESULT")
            for issue in "${open_issues[@]}"; do
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments" \
                -f body="$comment" >/dev/null
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${issue}" \
                -f state="closed" \
                -f state_reason="completed" >/dev/null
              echo "Closed issue #${issue} after green run on ${short_sha}."
            done
          else
            echo "No failure and not all jobs succeeded (linux=${LINUX_RESULT}, windows=${WINDOWS_RESULT}); leaving issues unchanged."
          fi
