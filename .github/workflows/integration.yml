name: Integration
# Real servers and real builds, once, on Linux (none of this code is OS-specific; 3 systems gave 774 jobs and no
# failure only one system saw). On every push to main, and on a pull request that touches their code:
# - plugins: pinned server plugins on fresh clones through the packaged command (fast, jar, plugin-check on MockBukkit,
#   each break made on purpose; tools/tests/ServerPluginFixtures.java).
# - server-check: plugins on a real headless Paper server with a bot player, one part per job (scenario, bot, breaks;
#   tools/tests/ServerCheckFixtures.java).
# - stonecutter: three representative Stonecutter nodes set up and compiled through mmt; every node runs on
#   demand in stonecutter-nodes.yml.
# Caches are saved only from a passing main run.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'tools/cli/**'
      - 'tools/servercheck/**'
      - 'tools/plugincheck/**'
      - 'tools/tests/Server*'
      - 'tools/tests/server-check-*'
      - 'bench/server-plugins/**'
      - 'bench/real-mods/**'
      - 'knowledge/mockbukkit.json'
      - 'knowledge/mcprotocollib.json'
      - 'knowledge/viaproxy.json'
      - '.github/workflows/integration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Gradle and JDK caches
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            ~/.mmt/jdks
          key: plugins-${{ hashFiles('bench/server-plugins/manifest.json') }}
          restore-keys: plugins-
      - run: java tools/cli/Bootstrap.java . package --json
      - name: Server plugins through mmt
        run: java tools/tests/ServerPluginFixtures.java . build/distributions/mmt.jar
      - name: Save caches (main only)
        if: success() && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            ~/.mmt/jdks
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Receipts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plugins-runs
          path: .runs
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  server-check:
    name: server-check (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        part: [scenario, bot, breaks]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Paper, Gradle and JDK caches
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            ~/.mmt/jdks
            ~/.mmt/servers
            ~/.mmt/tools
          key: server-check-${{ matrix.part }}-${{ hashFiles('bench/server-plugins/manifest.json', 'knowledge/mcprotocollib.json', 'knowledge/viaproxy.json') }}
          restore-keys: server-check-${{ matrix.part }}-
      - run: java tools/cli/Bootstrap.java . package --json
      - name: Plugins on a real Paper server through mmt
        run: java tools/tests/ServerCheckFixtures.java . build/distributions/mmt.jar "${{ matrix.part }}"
      - name: Save caches (main only)
        if: success() && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            ~/.mmt/jdks
            ~/.mmt/servers
            ~/.mmt/tools
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Receipts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-check-${{ matrix.part }}-runs
          path: .runs
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
  stonecutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gradle and JDK caches
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            ~/.mmt/jdks
          key: stonecutter-${{ hashFiles('bench/real-mods/manifest.json') }}
          restore-keys: stonecutter-
      - name: Set up and compile three nodes
        run: python bench/real-mods/run.py --compile-nodes --only diorama-26.3,diorama-1.21.1,ias-26.3-fabric --cache "${{ runner.temp }}/real-mods" --out "${{ runner.temp }}/real-mods-results" --label sample
      - name: Stop Gradle before the cache save
        if: success() && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        run: pkill -f GradleDaemon || true
      - name: Save caches (main only)
        if: success() && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            ~/.mmt/jdks
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Node results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stonecutter-sample
          path: ${{ runner.temp }}/real-mods-results
          if-no-files-found: ignore
          retention-days: 7
  report-red-main:
    needs: [plugins, server-check, stonecutter]
    if: always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: report-red-main-integration
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: Integration red on main
      PLUGINS_RESULT: ${{ needs.plugins.result }}
      SERVER_CHECK_RESULT: ${{ needs.server-check.result }}
      STONECUTTER_RESULT: ${{ needs.stonecutter.result }}
    steps:
      - name: Update or close red-main issue
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          short_sha="${GITHUB_SHA:0:7}"
          head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo "Skipping stale run for ${short_sha}; main is now at ${head_sha:0:7}."
            exit 0
          fi
          failed=()
          for pair in "plugins:${PLUGINS_RESULT}" "server-check:${SERVER_CHECK_RESULT}" "stonecutter:${STONECUTTER_RESULT}"; do
            job="${pair%%:*}"
            res="${pair#*:}"
            if [ "$res" = "failure" ]; then
              failed+=("$job")
            fi
          done
          issues_json=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100")
          mapfile -t open_issues < <(
            printf '%s\n' "$issues_json" \
              | jq -rs --arg t "$TITLE" '[.[][] | select(.pull_request == null and .title == $t)] | sort_by(.number) | .[].number'
          )
          if [ "${#failed[@]}" -gt 0 ]; then
            failed_list=$(printf '%s, ' "${failed[@]}")
            failed_list="${failed_list%, }"
            body=$(printf 'Integration is red on `main` at commit %s (`%s`).\n\n- Run: %s\n- Failed: %s\n- `plugins`: %s\n- `server-check`: %s\n- `stonecutter`: %s\n' \
              "$GITHUB_SHA" "$short_sha" "$run_url" "$failed_list" "$PLUGINS_RESULT" "$SERVER_CHECK_RESULT" "$STONECUTTER_RESULT")
            if [ "${#open_issues[@]}" -eq 0 ]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues" \
                -f title="$TITLE" \
                -f body="$body" >/dev/null
              echo "Opened issue '${TITLE}' for ${short_sha} (failed: ${failed_list})."
            else
              issue="${open_issues[0]}"
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${issue}" \
                -f body="$body" >/dev/null
              comment=$(printf 'Still red on `main` at commit %s (`%s`): failed %s.\n\n- Run: %s\n- `plugins`: %s\n- `server-check`: %s\n- `stonecutter`: %s\n' \
                "$GITHUB_SHA" "$short_sha" "$failed_list" "$run_url" "$PLUGINS_RESULT" "$SERVER_CHECK_RESULT" "$STONECUTTER_RESULT")
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments" \
                -f body="$comment" >/dev/null
              echo "Updated issue #${issue} for ${short_sha} (failed: ${failed_list})."
            fi
          elif [ "${PLUGINS_RESULT}" = "success" ] && [ "${SERVER_CHECK_RESULT}" = "success" ] && [ "${STONECUTTER_RESULT}" = "success" ]; then
            if [ "${#open_issues[@]}" -eq 0 ]; then
              echo "Integration is green on main and no open '${TITLE}' issue exists."
              exit 0
            fi
            comment=$(printf 'Integration is green again on `main` at commit %s (`%s`).\n\n- Run: %s\n- `plugins`: %s\n- `server-check`: %s\n- `stonecutter`: %s\n' \
              "$GITHUB_SHA" "$short_sha" "$run_url" "$PLUGINS_RESULT" "$SERVER_CHECK_RESULT" "$STONECUTTER_RESULT")
            for issue in "${open_issues[@]}"; do
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${issue}/comments" \
                -f body="$comment" >/dev/null
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${issue}" \
                -f state="closed" \
                -f state_reason="completed" >/dev/null
              echo "Closed issue #${issue} after green run on ${short_sha}."
            done
          else
            echo "No failure and not all jobs succeeded (plugins=${PLUGINS_RESULT}, server-check=${SERVER_CHECK_RESULT}, stonecutter=${STONECUTTER_RESULT}); leaving issues unchanged."
          fi
