name: Stonecutter nodes (nightly)
# Every node of Diorama and In-Game Account Switcher: setup and compile through modaccel on fresh
# pinned clones, Windows, Linux and macOS, no game. Too slow for a PR (10-40 min a mod and OS
# cold), so it runs nightly and on demand and never blocks a merge; PRs run stonecutter-sample.
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stonecutter-nodes:
    # Real Stonecutter mods, fresh pinned clones: setup and compile on every version node. No game.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        mod: [diorama-all, ias-all]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Gradle and JDK caches
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            .modaccel/jdks
          key: stonecutter-${{ runner.os }}-${{ matrix.mod }}-${{ hashFiles('bench/real-mods/manifest.json') }}-${{ github.run_id }}
          restore-keys: stonecutter-${{ runner.os }}-${{ matrix.mod }}-
      - name: Setup and compile every node
        run: python bench/real-mods/run.py --compile-nodes --only ${{ matrix.mod }} --cache "${{ runner.temp }}/real-mods" --out "${{ runner.temp }}/real-mods-results" --label ${{ matrix.mod }}
      - name: Save caches even when a node fails
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            .modaccel/jdks
          key: stonecutter-${{ runner.os }}-${{ matrix.mod }}-${{ hashFiles('bench/real-mods/manifest.json') }}-${{ github.run_id }}
      - name: Node results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stonecutter-${{ runner.os }}-${{ matrix.mod }}
          path: ${{ runner.temp }}/real-mods-results
          if-no-files-found: ignore
