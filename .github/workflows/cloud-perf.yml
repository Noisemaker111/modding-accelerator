name: Cloud perf A/B
# modaccel perf-optimize on one GitHub runner instead of an agent's loaded PC: baseline and candidate launch in
# turn (A, B, A, B: --arms sequential) on the same 4-core ubuntu-latest machine, each a fresh hidden client on a
# virtual display (Xvfb) with Mesa's software OpenGL. Dispatch with tools/cloud-run (python tools/cloud-run.py perf).
# Defaults are the Diorama play experiment (bench/diorama/README.md) with tint-carry-over.patch. It never applies the
# patch (--dry-run). The run's optimize.json, report, record.json and game logs are uploaded. Gradle's cache is only
# restored, from the Stonecutter cache (Diorama 1.21.1 among it) integration.yml keeps on main, never saved. No retries.
run-name: "Cloud perf A/B: ${{ inputs.patch }} x${{ inputs.runs }} ${{ inputs.request }}"
on:
  workflow_dispatch:
    inputs:
      repo:
        description: The mod's source repository
        default: https://github.com/SunkenInTime/diorama
      commit:
        description: The pinned commit both arms start from
        default: 7aa1484cd5dfe4ec19d246a58fb23bbc48a8bc6e
      prepare:
        description: Run first, from the repo root ({root} is the clone); empty for none
        default: python bench/diorama/play/prepare_world.py --root {root}
      experiment:
        description: perf-optimize --experiment
        default: bench/diorama/play/experiment.json
      patch:
        description: perf-optimize --patch (the candidate, a git diff against the commit)
        default: bench/diorama/tint-carry-over.patch
      runs:
        description: Paired launches (each pair is one baseline and one candidate launch)
        default: '3'
      gradle-cache:
        description: Restore-key prefix of a Gradle cache main keeps; empty for none
        default: stonecutter-
      request:
        description: Set by tools/cloud-run to find the run it started
        default: ''
permissions:
  contents: read
jobs:
  ab:
    runs-on: ubuntu-latest
    # Diorama cold: about 10 min to set up, compile and make the world; each launch about 4 min on software OpenGL.
    timeout-minutes: 120
    env:
      ROOT_DIR: .runs/perf-source
      REPO: ${{ inputs.repo }}
      COMMIT: ${{ inputs.commit }}
      PREPARE: ${{ inputs.prepare }}
      EXPERIMENT: ${{ inputs.experiment }}
      PATCH: ${{ inputs.patch }}
      RUNS: ${{ inputs.runs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gradle cache (restored only)
        if: inputs.gradle-cache != ''
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            ~/.modaccel/jdks
          key: cloud-perf-never-saved
          restore-keys: ${{ inputs.gradle-cache }}
      - name: Virtual display with software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 >/dev/null
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "machine: $(nproc) logical processors, $(free -g | awk '/Mem:/ {print $2}') GB"
      - name: The source at its commit
        run: |
          git clone -q --filter=blob:none "$REPO" "$ROOT_DIR"
          git -C "$ROOT_DIR" checkout -q "$COMMIT"
          ./modaccel preferences --background on --quiet on
      - name: Prepare
        if: inputs.prepare != ''
        run: |
          start=$(date +%s)
          ${PREPARE//\{root\}/$ROOT_DIR}
          echo "prepare: $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Baseline and candidate in turn
        run: |
          set -o pipefail
          ./modaccel perf-optimize --root "$ROOT_DIR" --experiment "$EXPERIMENT" --patch "$PATCH" --runs "$RUNS" \
            --arms sequential --dry-run --label cloud --out .runs/cloud-perf | tee perf.txt
          { echo '```'; cat perf.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Stop the game
        if: always()
        run: ./modaccel game-stop --root "$ROOT_DIR" || true
      - name: Report, record and game logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf
          path: |
            perf.txt
            .runs/cloud-perf/*.json
            .runs/cloud-perf/*.html
            .runs/cloud-perf/runs
            .runs/cloud-perf/logs
            .runs/perf-records
            .runs/perf-source/.runs/portable/*/*.log
            .runs/perf-source/.runs/portable/*/result.json
            .runs/portable/*/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
