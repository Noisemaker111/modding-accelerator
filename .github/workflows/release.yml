name: Release
# One button: Actions > Release > Run workflow, on main. It numbers the release from the last one (0.MINOR.PATCH,
# CONTRIBUTING.md says which to pick), builds the desktop app for Windows and Linux, packages it with the command
# line into the portable ZIP, runs the self-test and the extracted-ZIP acceptance test on that exact build, then tags
# the commit and publishes the release with notes from the PRs merged since the last one. Nothing is tagged or
# published unless every step passes. Run on any other branch, it is a rehearsal: every step but tag and publish.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "minor: new things people can do. patch: fixes only."
        type: choice
        options: [minor, patch]
        default: minor
      highlights:
        description: "Optional: a few lines for the top of the notes (what's new, in plain words)."
        type: string
        required: false
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  desktop:
    strategy:
      matrix:
        include:
          - os: windows-latest
            binary: mmt-desktop.exe
          - os: ubuntu-latest
            binary: mmt-desktop
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxkbcommon-dev libwayland-dev >/dev/null
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          save-if: false
      - run: cargo build --release --locked
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: app/target/release/${{ matrix.binary }}
          if-no-files-found: error

  release:
    needs: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Number this release
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: |
          last=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          IFS=. read -r major minor patch <<< "${last#v}"
          if [ -z "$last" ]; then major=0; minor=1; patch=0; fi  # before this workflow: 0.1.0 betas only
          if [ "$BUMP" = patch ]; then patch=$((patch + 1)); else minor=$((minor + 1)); patch=0; fi
          version="$major.$minor.$patch"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then echo "v$version already exists"; exit 1; fi
          previous=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PREVIOUS=$previous" >> "$GITHUB_ENV"
          echo "Releasing $version (notes since ${previous:-the first commit})"
      - name: Stamp the version into the build
        run: |
          sed -i "s/static final String VERSION = \"dev\";/static final String VERSION = \"$VERSION\";/" tools/cli/Support.java
          grep -q "VERSION = \"$VERSION\"" tools/cli/Support.java
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: app/target/release
          merge-multiple: true
      - name: Package (command line + desktop app)
        run: |
          chmod +x app/target/release/mmt-desktop
          touch app/target/release/mmt-desktop app/target/release/mmt-desktop.exe
          java tools/cli/Bootstrap.java . package --json
          unzip -l build/distributions/mmt-portable.zip | grep -E 'mmt-desktop(\.exe|-linux)$'
          test "$(unzip -l build/distributions/mmt-portable.zip | grep -cE 'mmt-desktop(\.exe|-linux)$')" = 2
      - name: Self-test from the package
        run: java -jar build/distributions/mmt.jar self-test --root . --json
      - name: Extracted ZIP acceptance
        run: java tools/tests/PackageAcceptanceTest.java build/distributions/mmt-portable.zip build/distributions/mmt-portable.zip.sha256 "${{ runner.temp }}"
      - name: Rehearsal, not published
        if: github.ref != 'refs/heads/main'
        run: echo "Built and checked $VERSION from $GITHUB_REF_NAME; only a run on main tags and publishes."
      - name: Tag and publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          HIGHLIGHTS: ${{ inputs.highlights }}
        run: |
          out="${{ runner.temp }}/assets"; mkdir -p "$out"
          cp build/distributions/mmt.jar "$out/mmt-$VERSION.jar"
          cp build/distributions/mmt-portable.zip "$out/mmt-$VERSION-portable.zip"
          cd "$out"
          for f in *.jar *.zip; do sha256sum "$f" > "$f.sha256"; done
          start=()
          if [ -n "$PREVIOUS" ]; then start=(--notes-start-tag "$PREVIOUS"); fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Minecraft Modding Tools $VERSION" --notes "$HIGHLIGHTS" --generate-notes "${start[@]}" *
