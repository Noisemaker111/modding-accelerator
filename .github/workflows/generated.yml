name: Generated files

# docs/ (the website) is written from coverage/ by two scripts. This runs them on main
# after every push and commits the result when it changed, so a branch never regenerates them: a PR that
# only edits coverage/ cannot conflict on a 480 KB page, and the site is never behind the data.
# The commit is made with the workflow's own token, which starts no other workflow.

on:
  push:
    branches: [main]
    paths:
      - "coverage/**"
      - "bench/**"
      - "knowledge/fixes.json"
      - "tools/cli/Support.java"
      - ".github/workflows/generated.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generated-files
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write docs/
        run: |
          python bench/bench_page.py
          python bench/porting_map.py
      - name: Commit what changed
        run: |
          if git diff --quiet -- docs; then
            echo "docs/ already matches coverage/."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Regenerate the website from coverage/"
          # Another merge may have landed while this ran: take it and write the files again on top.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            python bench/bench_page.py
            python bench/porting_map.py
            if git diff --quiet -- docs; then exit 0; fi
            git add docs
            git commit -m "Regenerate the website from coverage/"
          done
          echo "::error::Could not push the regenerated files to main. If main is protected, allow this workflow to push, or run python bench/bench_page.py and python bench/porting_map.py by hand."
          exit 1
