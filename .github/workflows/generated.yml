name: Generated files

# ROADMAP.md and docs/ (the website) are written from coverage/ by two scripts. This runs them on main
# after every push and commits the result when it changed, so a branch never regenerates them: a PR that
# only edits coverage/ cannot conflict on a 480 KB page, and the site is never behind the data.
# The commit is pushed with the DOCS_DEPLOY_KEY deploy key, the main ruleset's only bypass. That push runs CI on it
# and not this workflow again (its paths leave out ROADMAP.md and docs/).

on:
  push:
    branches: [main]
    paths:
      - "coverage/**"
      - "bench/**"
      - "knowledge/fixes.json"
      - "tools/cli/Support.java"
      - ".github/workflows/generated.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-files
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # main is protected (required checks: linux, windows). The deploy key is the ruleset's only bypass, so this
      # job pushes over SSH with it; the regenerated files are written from coverage/ that CI already checked.
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DOCS_DEPLOY_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write ROADMAP.md and docs/
        run: |
          python bench/bench_page.py
          python bench/porting_map.py
      - name: Commit what changed
        run: |
          if git diff --quiet -- ROADMAP.md docs; then
            echo "ROADMAP.md and docs/ already match coverage/."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md docs
          git commit -m "Regenerate ROADMAP.md and the website from coverage/"
          # Another merge may have landed while this ran: take it and write the files again on top.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            python bench/bench_page.py
            python bench/porting_map.py
            if git diff --quiet -- ROADMAP.md docs; then exit 0; fi
            git add ROADMAP.md docs
            git commit -m "Regenerate ROADMAP.md and the website from coverage/"
          done
          echo "::error::Could not push the regenerated files to main. Check that the DOCS_DEPLOY_KEY secret holds a write deploy key and that the main ruleset lets deploy keys bypass it."
          exit 1
