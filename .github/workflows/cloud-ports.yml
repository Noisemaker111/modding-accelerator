name: Cloud port board
# The porting scoreboard (python bench/port_board.py) on GitHub's runners: one ubuntu-latest job per case in
# bench/port-cases.json, each a fresh clone ported with mmt port --fix, at most 12 at once. Dispatch with
# tools/cloud-run (python tools/cloud-run.py ports). A job fails when its port got worse than what is recorded or
# could not run, as port_board.py exits. Each uploads its board row, the port's receipt and mmt's logs; the
# summary job joins the rows. No Gradle cache: every case has its own Gradle and game setup (about 1 GB each), and
# the repository's caches are already past GitHub's 10 GB limit, so a case's setup is measured cold. No retries.
# corpus=sweep runs the port sweep instead (python bench/sweep.py): one job per mod of bench/sweep/corpus.json and
# jump of its plan (MOD@TO), each porting it and starting each port that builds in a hidden game on a virtual display
# with software OpenGL; the summary job joins every run into the ranked tables (sweep.py summary).
run-name: "Cloud ports (${{ inputs.corpus }}): ${{ inputs.cases }} ${{ inputs.request }}"
on:
  workflow_dispatch:
    inputs:
      corpus:
        description: board (bench/port-cases.json) or sweep (bench/sweep/corpus.json, every jump, with game checks)
        default: board
      cases:
        description: Case ids (board) or mod ids (sweep), comma-separated, or all
        default: all
      starter_build:
        description: sweep only; true ports from a build generated from the loader's starter project (mmt port --starter-build)
        default: 'false'
      request:
        description: Set by tools/cloud-run to find the run it started
        default: ''
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cases: ${{ steps.plan.outputs.cases }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          CASES: ${{ inputs.cases }}
          CORPUS: ${{ inputs.corpus }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          import sys
          sweep = os.environ["CORPUS"] == "sweep"
          if sweep:
              mods = json.load(open("bench/sweep/corpus.json", encoding="utf-8"))["mods"]
              cases = [m["id"] for m in mods]
          else:
              cases = [c["id"] for c in json.load(open("bench/port-cases.json", encoding="utf-8"))["cases"]]
          wanted = [x.strip() for x in os.environ["CASES"].split(",") if x.strip()]
          if wanted != ["all"]:
              unknown = [x for x in wanted if x not in cases]
              if unknown:
                  raise SystemExit(f"No case {unknown} in the {os.environ['CORPUS']} corpus; it has {cases}")
              cases = wanted
          if sweep:
              # One job per mod and jump, so a big mod's jumps run side by side instead of one after another.
              sys.path.insert(0, "bench")
              import sweep as S
              cases = [f"{m['id']}@{to}" for m in mods if m["id"] in cases for to, _ in S.plan(m)]
          print("cases=" + json.dumps(cases))
          EOF
  port:
    needs: plan
    if: inputs.corpus != 'sweep'
    name: ${{ matrix.case }}
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        case: ${{ fromJSON(needs.plan.outputs.cases) }}
    runs-on: ubuntu-latest
    # A cold NeoForge port decompiles the game for both versions; port_board.py's own limit per port is 2 hours.
    timeout-minutes: 60
    env:
      CASE: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Port the case
        run: |
          set -o pipefail
          python bench/port_board.py --only "$CASE" --timeout 3300 | tee board.md
          cat board.md >> "$GITHUB_STEP_SUMMARY"
      - name: Board row, receipt and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: port-${{ matrix.case }}
          path: |
            board.md
            .runs/port-board/*.json
            .runs/port-board/*/.runs/portable/*/*.log
            .runs/port-board/*/.runs/portable/*/result.json
            .runs/portable/*/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
  sweep:
    needs: plan
    if: inputs.corpus == 'sweep'
    name: sweep ${{ matrix.mod }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        mod: ${{ fromJSON(needs.plan.outputs.cases) }}
    runs-on: ubuntu-latest
    # One jump of one mod (MOD@TO), a fresh port; a cold NeoForge port of a big mod to 26.3 can take over an hour.
    timeout-minutes: 150
    env:
      CASE: ${{ matrix.mod }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Virtual display with software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 >/dev/null
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          ./mmt preferences --background on --quiet on
      - name: Port the mod over this jump, and start the port if it builds
        env:
          STARTER: ${{ inputs.starter_build == 'true' && '--starter-build' || '' }}
        run: python bench/sweep.py run --tag cloud --only "${CASE%@*}" --to "${CASE#*@}" --jobs 1 --timeout 4800 $STARTER
      - name: Runs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-${{ matrix.mod }}
          path: |
            .runs/sweep/runs/cloud/*.json
            .runs/sweep/clones/*/.runs/portable/*/*.log
            .runs/sweep/clones/*/.runs/portable/*/result.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
  sweep-summary:
    needs: sweep
    if: always() && needs.sweep.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sweep-*
          path: artifacts
      - name: Join every run into the ranked tables
        run: |
          mkdir -p .runs/sweep/runs/cloud
          find artifacts -path '*/runs/cloud/*.json' -exec cp {} .runs/sweep/runs/cloud/ \;
          python3 bench/sweep.py summary --tag cloud --save | tee summary.md >> "$GITHUB_STEP_SUMMARY"
          cp bench/sweep/results/cloud.json sweep.json
      - uses: actions/upload-artifact@v4
        with:
          name: summary
          path: |
            summary.md
            sweep.json
          retention-days: 14
  summary:
    needs: port
    if: always() && needs.port.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: port-*
          path: artifacts
      - name: Join the board rows
        run: |
          {
            echo "| Port | Recorded | Last run | Now | | Time |"
            echo "|---|---|---|---|---|---|"
            for f in artifacts/*/board.md; do sed -n '3p' "$f"; done
            echo
            for f in artifacts/*/board.md; do sed -n '/^Did not run:/,/^$/p; /^What is left/,$p' "$f"; done
          } | tee summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: summary
          path: summary.md
          retention-days: 14
